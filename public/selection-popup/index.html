<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>划词翻译 · CopyTranslator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <button id="selection-button" data-action="translate" title="点击翻译 · CopyTranslator" aria-label="翻译选中文字" hidden><img src="icon.png" alt="CopyTranslator"></button>
  <main class="popup" hidden>
    <div class="resize-handle resize-n" data-resize="n" aria-hidden="true"></div>
    <div class="resize-handle resize-ne" data-resize="ne" aria-hidden="true"></div>
    <div class="resize-handle resize-e" data-resize="e" aria-hidden="true"></div>
    <div class="resize-handle resize-se" data-resize="se" aria-hidden="true"></div>
    <div class="resize-handle resize-s" data-resize="s" aria-hidden="true"></div>
    <div class="resize-handle resize-sw" data-resize="sw" aria-hidden="true"></div>
    <div class="resize-handle resize-w" data-resize="w" aria-hidden="true"></div>
    <div class="resize-handle resize-nw" data-resize="nw" aria-hidden="true"></div>
    <header class="titlebar">
      <div id="drag-handle" class="drag-handle" title="按住标题栏拖动窗口" aria-label="拖动窗口">
        <svg class="grip" aria-hidden="true" viewBox="0 0 16 16"><path d="M5 3h.01M11 3h.01M5 8h.01M11 8h.01M5 13h.01M11 13h.01"/></svg>
        <img class="brand" src="icon.png" alt="" draggable="false"><span>CopyTranslator</span>
      </div>
      <div class="size-presets" role="group" aria-label="浮窗大小">
        <button type="button" data-size="small" aria-label="小尺寸" aria-pressed="true" title="小尺寸（当前默认大小）">小</button>
        <button type="button" data-size="medium" aria-label="中等尺寸" aria-pressed="false" title="中等尺寸">中</button>
        <button type="button" data-size="large" aria-label="较大尺寸" aria-pressed="false" title="较大尺寸">大</button>
      </div>
      <button id="pin" class="icon" title="固定浮窗" aria-label="固定浮窗" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m15 3 6 6-4 1-4 6-2-2-6 6-1-1 6-6-2-2 6-4z"/></svg></button>
      <button class="icon" data-action="settings" title="设置翻译引擎" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      <button class="icon" data-action="close" title="关闭（Esc）" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </header>
    <div class="toolbar">
      <div class="pane-tabs" role="tablist" aria-label="阅读方式">
        <button id="translation-tab" role="tab" aria-selected="true" aria-controls="translation-panel" data-pane="translation">翻译</button>
        <button id="chat-tab" role="tab" aria-selected="false" aria-controls="chat-panel" data-pane="chat">对话</button>
      </div>
      <button id="engine" class="engine" type="button" aria-label="选择翻译引擎" aria-haspopup="menu" aria-controls="engine-menu" aria-expanded="false">
        <span id="engine-name">选择翻译引擎</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
    <div id="engine-menu" class="engine-menu" role="menu" aria-label="翻译引擎" hidden></div>
    <section class="card source-card">
      <div class="section-heading">
        <span id="source-label">原文</span>
        <div class="source-actions">
          <button id="incremental" class="incremental-button" data-action="incremental" aria-pressed="false" title="与主界面共用开关：累积原文，每次全量重译">增量复制</button>
          <button id="clear-accumulated" class="text-button" data-action="clear-accumulated" title="清空浮窗累积的原文，开始新的翻译" hidden>清空</button>
          <button id="copy-source" class="icon small" data-action="copy-source" title="复制原文" aria-label="复制原文"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg></button>
        </div>
      </div>
      <div id="incremental-status" class="incremental-status" hidden></div>
      <div id="source" class="text source"></div>
      <button id="expand" class="text-button" hidden>展开原文</button>
    </section>
    <section id="translation-panel" class="card result-card" role="tabpanel" aria-labelledby="translation-tab" aria-live="polite" aria-busy="true">
      <div class="section-heading"><span id="direction">译文</span><button id="copy-result" class="icon small" data-action="copy-result" title="复制译文" aria-label="复制译文" disabled><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg></button></div>
      <div id="loading" class="loading"><span class="dots"><i></i><i></i><i></i></span><span>正在翻译…</span></div>
      <div id="result" class="text result"></div>
      <div id="error" class="error" hidden></div>
      <button id="retry" class="text-button" data-action="retry" hidden>重试</button>
    </section>
    <section id="chat-panel" class="chat-panel" role="tabpanel" aria-labelledby="chat-tab" hidden>
      <div class="chat-heading"><span>基于上方原文 · 可连续追问</span><button id="chat-clear" class="text-button" data-action="chat-clear">新对话</button></div>
      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite">
        <div id="chat-empty" class="chat-empty">这段话有哪些难点？可以让 AI 解释、总结或比较。</div>
      </div>
      <div id="chat-unavailable" class="chat-empty" hidden>请在“AI 供应商”中启用一个支持文本对话的模型。</div>
      <div id="chat-error" class="error" role="alert" hidden></div>
      <button id="chat-retry" class="text-button" data-action="chat-retry" hidden>重试回答</button>
      <form id="chat-form" class="chat-form">
        <label class="sr-only" for="chat-input">对当前原文提问</label>
        <textarea id="chat-input" rows="2" maxlength="4000" placeholder="针对这段文字提问…" aria-describedby="chat-input-hint"></textarea>
        <div class="chat-composer-actions"><span id="chat-input-hint">Enter 发送 · Shift+Enter 换行</span><button id="chat-stop" class="text-button" type="button" data-action="chat-stop" hidden>停止</button><button id="chat-send" type="submit">发送</button></div>
      </form>
    </section>
    <footer><span id="hint">点击外部关闭 · Esc</span><button class="text-button" data-action="ai-settings">配置 AI 翻译商</button><button class="text-button" data-action="main">打开主窗口 <span aria-hidden="true">↗</span></button></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
